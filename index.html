<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spelling Practice</title>
<meta name="description" content="A spelling practice game for Alina and Monty. No sign-in needed -- each device keeps its own saved words, scores and badges.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Quicksand:wght@500;600;700&family=Marcellus&family=Cinzel:wght@600;700&display=swap">
<style>
  :root{
    --bg:#FFF6FB;
    --bg-panel:#FFFFFF;
    --bg-soft:#F4F0FF;
    --bg-soft-2:#EAFBF3;
    --ink:#453653;
    --ink-soft:#8478A0;
    --pink:#FF8FAE;
    --pink-deep:#FF6D95;
    --blue:#62C4F2;
    --blue-deep:#2FA3E6;
    --mint:#6FE0B3;
    --mint-deep:#38C793;
    --yellow:#FFC94D;
    --yellow-deep:#F5A623;
    --coral:#FF9A76;
    --surface-2:#FFFFFF;
    --border-soft:#D8CFF0;
    --dot-border:#FFFFFF;
    --font-display:'Baloo 2','Quicksand',sans-serif;
    --shadow-lg:0 22px 44px -18px rgba(69,54,83,.35);
    --shadow-sm:0 8px 18px -10px rgba(69,54,83,.28);
    --radius-card:32px;
    --radius-pill:999px;
  }

  /* ---------- themes ---------- */
  .app[data-app-theme="wild-woods"]{
    --bg:#141C18;
    --bg-panel:#1E2A23;
    --bg-soft:#26362D;
    --bg-soft-2:#2B3A2E;
    --ink:#EFE9DC;
    --ink-soft:#B4A997;
    --pink:#C97B4A;
    --pink-deep:#A85C31;
    --blue:#6FA98A;
    --blue-deep:#4C8468;
    --mint:#9FD8B0;
    --mint-deep:#5FAE7C;
    --yellow:#E8C165;
    --yellow-deep:#C89A3D;
    --coral:#D98B6D;
    --surface-2:#243128;
    --border-soft:#3B4F41;
    --dot-border:#1E2A23;
    --font-display:'Marcellus','Quicksand',serif;
    --shadow-lg:0 24px 46px -16px rgba(0,0,0,.55);
    --shadow-sm:0 10px 20px -10px rgba(0,0,0,.5);
  }
  .app[data-app-theme="crystal-shrine"]{
    --bg:#181229;
    --bg-panel:#241A3B;
    --bg-soft:#2D2148;
    --bg-soft-2:#2A2350;
    --ink:#EDE6FF;
    --ink-soft:#B3A3D9;
    --pink:#A97BE8;
    --pink-deep:#8B5CE0;
    --blue:#5FC7C2;
    --blue-deep:#3AA6A1;
    --mint:#8FE0C9;
    --mint-deep:#4FBE9E;
    --yellow:#E8C56B;
    --yellow-deep:#C9A03F;
    --coral:#E28FAE;
    --surface-2:#2C2150;
    --border-soft:#4A3B72;
    --dot-border:#241A3B;
    --font-display:'Cinzel','Quicksand',serif;
    --shadow-lg:0 24px 52px -14px rgba(90,40,180,.45);
    --shadow-sm:0 10px 22px -8px rgba(90,40,180,.4);
  }
  .app[data-app-theme="wild-woods"] .bg-decor span,
  .app[data-app-theme="crystal-shrine"] .bg-decor span{
    opacity:.5;
    filter:blur(7px);
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Quicksand',-apple-system,BlinkMacSystemFont,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:var(--font-display);
    font-weight:800;
    text-wrap:balance;
    margin:0;
  }
  button{font-family:inherit;}
  .tabular{font-variant-numeric:tabular-nums;}

  /* ---------- layout shell ---------- */
  .app{
    position:relative;
    min-height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:28px 20px calc(28px + env(safe-area-inset-bottom,0px));
    overflow-x:hidden;
    background:var(--bg);
    transition:background .3s ease;
  }

  .bg-decor{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    overflow:hidden;
  }
  .bg-decor span{
    position:absolute;
    border-radius:50%;
    filter:blur(2px);
    opacity:.35;
    animation:floaty 9s ease-in-out infinite;
  }
  .bg-decor span:nth-child(1){width:180px;height:180px;background:var(--pink);top:-60px;left:-50px;animation-duration:11s;}
  .bg-decor span:nth-child(2){width:120px;height:120px;background:var(--blue);top:12%;right:-40px;animation-duration:8s;animation-delay:.6s;}
  .bg-decor span:nth-child(3){width:90px;height:90px;background:var(--yellow);bottom:14%;left:4%;animation-duration:10s;animation-delay:1.1s;}
  .bg-decor span:nth-child(4){width:150px;height:150px;background:var(--mint);bottom:-70px;right:8%;animation-duration:12s;animation-delay:.3s;}

  .topbar{
    position:relative;
    z-index:2;
    width:100%;
    max-width:640px;
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:18px;
  }
  .topbar[hidden]{display:none;}
  .icon-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    width:44px;
    height:44px;
    border-radius:var(--radius-pill);
    border:none;
    background:var(--bg-panel);
    box-shadow:var(--shadow-sm);
    color:var(--ink-soft);
    cursor:pointer;
    flex:0 0 auto;
    transition:transform .15s ease;
  }
  .icon-btn:hover{transform:translateY(-2px);}
  .icon-btn:active{transform:translateY(0) scale(.94);}
  .icon{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .icon-star{fill:var(--yellow-deep);stroke:none;}

  .progress-dots{
    flex:1;
    display:flex;
    gap:7px;
    justify-content:center;
    flex-wrap:wrap;
  }
  .progress-dots .dot{
    width:11px;height:11px;border-radius:50%;
    background:var(--bg-soft);
    border:2px solid var(--dot-border);
    box-shadow:0 0 0 2px var(--bg-soft);
    transition:transform .2s ease, background .2s ease;
  }
  .progress-dots .dot.done{background:var(--mint);}
  .progress-dots .dot.current{background:var(--pink);transform:scale(1.35);}

  .star-tally{
    display:flex;
    align-items:center;
    gap:6px;
    background:var(--bg-panel);
    padding:8px 14px;
    border-radius:var(--radius-pill);
    box-shadow:var(--shadow-sm);
    font-weight:700;
    font-size:1.05rem;
    flex:0 0 auto;
  }

  .stage{
    position:relative;
    z-index:2;
    width:100%;
    max-width:640px;
    flex:1;
    display:flex;
  }
  .screen{display:none;width:100%;}
  .screen.active{display:flex;flex-direction:column;align-items:center;animation:rise .35s ease;}

  .card{
    width:100%;
    background:var(--bg-panel);
    border-radius:var(--radius-card);
    box-shadow:var(--shadow-lg);
    padding:32px 28px;
  }

  /* ---------- mascot ---------- */
  .mascot{display:block;}
  .mascot--lg{width:132px;height:132px;}
  .mascot--sm{width:40px;height:40px;flex:0 0 auto;}
  .mascot--xl{width:168px;height:168px;}
  .mascot.idle{animation:floaty 3.4s ease-in-out infinite;}
  .mascot.celebrate{animation:bouncePop .8s ease;}
  .mascot.oops{animation:wobble .5s ease;}

  /* ---------- home screen ---------- */
  #screen-home .card{display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;position:relative;}
  .badges-quick-btn{position:absolute;top:16px;right:16px;z-index:2;width:40px;height:40px;}
  .badges-quick-btn .icon{width:20px;height:20px;}
  .speech-bubble{
    position:relative;
    background:var(--bg-soft);
    border-radius:22px;
    padding:12px 20px;
    font-weight:700;
    color:var(--ink);
    max-width:340px;
  }
  .home-sub{color:var(--ink-soft);font-weight:600;margin-top:-8px;}

  .player-row{
    display:flex;
    gap:10px;
    width:100%;
    justify-content:center;
    flex-wrap:wrap;
  }
  .player-btn{
    flex:1 1 140px;
    max-width:190px;
    padding:11px 14px;
    border-radius:18px;
    border:2px solid var(--bg-soft);
    background:var(--bg-soft);
    color:var(--ink-soft);
    font-family:var(--font-display);
    font-weight:700;
    cursor:pointer;
    transition:transform .15s ease, background .15s ease, color .15s ease, border-color .15s ease;
  }
  .player-btn:hover{transform:translateY(-2px);}
  .player-btn.selected{background:var(--pink);border-color:var(--pink);color:#fff;}

  .game-setup{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:18px;
    width:100%;
    animation:rise .3s ease;
  }
  .game-setup[hidden]{display:none;}

  .scoreboard{
    display:flex;
    gap:10px;
    width:100%;
  }
  .scoreboard-item{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    background:var(--bg-soft-2);
    border-radius:18px;
    padding:12px 8px;
  }
  .sb-name{
    display:flex;
    align-items:center;
    gap:5px;
    font-weight:700;
    font-size:.88rem;
    color:var(--mint-deep);
    text-transform:uppercase;
    letter-spacing:.03em;
  }
  .sb-name .icon{width:14px;height:14px;color:var(--yellow-deep);}
  .sb-score{
    font-family:var(--font-display);
    font-weight:800;
    color:var(--ink);
    font-size:1.1rem;
  }
  .sb-week{width:100%;display:flex;flex-direction:column;gap:3px;margin-top:5px;}
  .sb-week-bar{width:100%;height:6px;border-radius:999px;background:var(--bg-soft);overflow:hidden;}
  .sb-week-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--mint),var(--mint-deep));border-radius:999px;transition:width .4s ease;}
  .sb-week-label{font-size:.78rem;font-weight:700;color:var(--ink-soft);}

  .badge-banner{
    display:flex;
    align-items:center;
    gap:12px;
    width:100%;
    background:linear-gradient(135deg,var(--yellow),var(--coral));
    color:#5A3E12;
    border-radius:20px;
    padding:12px 14px;
    text-align:left;
  }
  .badge-banner[hidden]{display:none;}
  .badge-banner-icon{width:38px;height:38px;flex:0 0 auto;}
  .badge-banner-text{flex:1;display:flex;flex-direction:column;gap:1px;min-width:0;}
  .badge-banner-text strong{font-family:var(--font-display);font-size:1rem;}
  .badge-banner-text span{font-size:.88rem;font-weight:600;opacity:.9;}
  .badge-banner .icon-btn{width:32px;height:32px;background:rgba(255,255,255,.55);color:#5A3E12;box-shadow:none;flex:0 0 auto;}

  .home-nav-row{
    display:flex;
    gap:10px;
    justify-content:center;
    flex-wrap:wrap;
    margin-top:-4px;
  }
  .nav-pill{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:.92rem;
    padding:8px 18px;
  }
  .nav-pill .icon{width:15px;height:15px;}

  /* ---------- badges screen ---------- */
  .badges-card,.themes-card{display:flex;flex-direction:column;gap:18px;text-align:left;}
  .badges-header{display:flex;align-items:center;gap:12px;}
  .badges-header h2{flex:1;text-align:left;font-size:1.35rem;}
  .badge-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
  .badge-slot{display:flex;flex-direction:column;align-items:center;gap:6px;}
  .badge-medallion{
    position:relative;
    width:100%;
    aspect-ratio:1;
    border-radius:50%;
    overflow:hidden;
    background:var(--bg-soft);
    box-shadow:var(--shadow-sm);
  }
  .badge-medallion svg{
    position:absolute;
    top:50%;
    left:50%;
    width:64%;
    height:64%;
    transform:translate(-50%,-50%);
    display:block;
  }
  .badge-slot.locked .badge-medallion{opacity:.4;filter:grayscale(1);}
  .badge-slot .badge-label{font-size:.8rem;font-weight:700;color:var(--ink-soft);text-align:center;}
  .badge-slot.locked .badge-label{opacity:.55;}

  /* ---------- themes screen ---------- */
  .theme-list{display:flex;flex-direction:column;gap:10px;}
  .theme-swatch{
    display:flex;
    align-items:center;
    gap:14px;
    border:2px solid var(--bg-soft);
    background:var(--bg-soft);
    border-radius:20px;
    padding:12px 14px;
    cursor:pointer;
    text-align:left;
    transition:transform .15s ease, border-color .15s ease;
  }
  .theme-swatch:hover{transform:translateY(-2px);}
  .theme-swatch.active{border-color:var(--pink);}
  .theme-swatch-preview{width:44px;height:44px;border-radius:14px;flex:0 0 auto;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);}
  .theme-preview-playground{background:linear-gradient(135deg,#FF8FAE,#62C4F2 60%,#FFC94D);}
  .theme-preview-wild-woods{background:linear-gradient(135deg,#141C18,#C97B4A 70%,#E8C165);}
  .theme-preview-crystal-shrine{background:linear-gradient(135deg,#181229,#A97BE8 65%,#5FC7C2);}
  .theme-swatch-info{flex:1;display:flex;flex-direction:column;gap:1px;}
  .theme-swatch-info strong{font-family:var(--font-display);font-size:1rem;color:var(--ink);}
  .theme-swatch-info small{color:var(--ink-soft);font-weight:600;font-size:.88rem;}
  .theme-check{width:18px;height:18px;color:var(--mint-deep);opacity:0;flex:0 0 auto;}
  .theme-swatch.active .theme-check{opacity:1;}

  .field-label{
    align-self:flex-start;
    font-weight:700;
    font-size:.95rem;
    color:var(--ink-soft);
    display:flex;
    flex-direction:column;
    gap:2px;
    text-align:left;
  }
  .field-label small{font-weight:600;color:var(--ink-soft);opacity:.75;font-size:.88rem;}

  textarea#word-input{
    width:100%;
    min-height:96px;
    resize:vertical;
    border-radius:20px;
    border:2px solid var(--bg-soft);
    background:var(--bg-soft);
    padding:14px 16px;
    font-family:'Quicksand',sans-serif;
    font-size:1.05rem;
    font-weight:600;
    color:var(--ink);
    outline-offset:2px;
    transition:border-color .15s ease, background .15s ease;
  }
  textarea#word-input:focus{border-color:var(--pink);background:var(--surface-2);}

  .mode-row{
    display:flex;
    gap:16px;
    width:100%;
    flex-wrap:wrap;
  }
  .mode-btn{
    flex:1 1 200px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    border:none;
    border-radius:26px;
    padding:22px 16px;
    cursor:pointer;
    color:#fff;
    box-shadow:var(--shadow-sm);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .mode-btn:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);}
  .mode-btn:active{transform:translateY(-1px) scale(.98);}
  .mode-btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:var(--shadow-sm);}
  .mode-btn .icon{width:30px;height:30px;stroke:#fff;}
  .mode-btn span.label{font-family:'Baloo 2',sans-serif;font-weight:700;font-size:1.15rem;}
  .mode-btn span.sub{font-size:.9rem;font-weight:600;opacity:.9;}
  .mode-scramble{background:linear-gradient(155deg,var(--pink),var(--pink-deep));}
  .mode-memory{background:linear-gradient(155deg,var(--blue),var(--blue-deep));}

  .home-hint{
    min-height:20px;
    font-weight:700;
    color:var(--coral);
    font-size:.95rem;
  }

  /* ---------- pill buttons (general) ---------- */
  .pill-btn{
    border:none;
    border-radius:var(--radius-pill);
    padding:12px 26px;
    font-family:var(--font-display);
    font-weight:700;
    font-size:1rem;
    cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease;
    box-shadow:var(--shadow-sm);
  }
  .pill-btn:hover{transform:translateY(-2px);}
  .pill-btn:active{transform:translateY(0) scale(.97);}
  .pill-btn.primary{background:var(--pink);color:#fff;}
  .pill-btn.secondary{background:var(--bg-soft);color:var(--ink);}
  .pill-btn.ghost{background:transparent;color:var(--ink-soft);box-shadow:none;}

  /* ---------- game screens shared ---------- */
  #screen-scramble .card,#screen-memory .card{display:flex;flex-direction:column;align-items:center;gap:22px;}
  .game-message{
    min-height:26px;
    font-weight:700;
    color:var(--ink-soft);
    text-align:center;
  }
  .game-message.warm{color:var(--mint-deep);}
  .game-message.nudge{color:var(--coral);}

  .hint-row{display:flex;justify-content:center;}
  .hint-btn{
    display:inline-flex;
    align-items:center;
    gap:7px;
    padding:9px 20px;
    font-size:.88rem;
  }
  .hint-btn .icon{width:16px;height:16px;}
  .hint-btn.active{background:var(--yellow);color:#5A3E12;}

  /* word scramble */
  .slots{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    justify-content:center;
  }
  .slots.shake{animation:shake .45s ease;}
  .slot{
    width:46px;height:54px;
    border-radius:14px;
    background:var(--bg-soft);
    border:2px dashed var(--border-soft);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-display);
    font-weight:800;
    font-size:1.4rem;
    text-transform:uppercase;
    color:var(--pink-deep);
    cursor:pointer;
    transition:transform .12s ease, opacity .35s ease;
  }
  .slot.filled{background:var(--surface-2);border:2px solid var(--pink);}
  .slot.filled:hover{transform:translateY(-3px);}
  .slot.empty{cursor:default;}
  .slot.hinted{opacity:.45;border-style:solid;}

  .tile-bank{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    justify-content:center;
    min-height:60px;
  }
  .tile{
    width:46px;height:54px;
    border-radius:14px;
    border:none;
    background:linear-gradient(160deg,var(--yellow),var(--yellow-deep));
    color:#5A3E12;
    font-family:var(--font-display);
    font-weight:800;
    font-size:1.4rem;
    text-transform:uppercase;
    cursor:pointer;
    box-shadow:var(--shadow-sm);
    transition:transform .12s ease, opacity .12s ease;
    animation:tilePop .25s ease;
  }
  .tile:hover{transform:translateY(-3px);}
  .tile:active{transform:translateY(0) scale(.95);}
  .tile.used{visibility:hidden;pointer-events:none;}

  /* memory flash */
  .memory-word{
    font-family:var(--font-display);
    font-weight:800;
    font-size:clamp(2rem,8vw,2.8rem);
    color:var(--blue-deep);
    letter-spacing:.02em;
    min-height:64px;
    display:flex;align-items:center;justify-content:center;
    text-transform:uppercase;
  }
  .memory-word.hidden-word{visibility:hidden;}
  .memory-input-row{
    display:flex;
    gap:10px;
    width:100%;
    justify-content:center;
  }
  input#memory-input{
    flex:1 1 220px;
    max-width:280px;
    border-radius:16px;
    border:2px solid var(--bg-soft);
    background:var(--bg-soft);
    padding:12px 16px;
    font-family:'Quicksand',sans-serif;
    font-weight:700;
    font-size:1.2rem;
    color:var(--ink);
    text-align:center;
    text-transform:lowercase;
  }
  input#memory-input:focus{border-color:var(--blue);background:var(--surface-2);outline-offset:2px;}

  .letter-grid{
    display:flex;
    flex-direction:column;
    gap:7px;
    width:100%;
    max-width:440px;
  }
  .kb-row{
    display:flex;
    gap:6px;
    justify-content:center;
  }
  .letter-key{
    width:34px;
    height:42px;
    flex:0 0 auto;
    border:none;
    border-radius:10px;
    background:var(--bg-soft);
    color:var(--ink);
    font-weight:700;
    font-family:'Quicksand',sans-serif;
    cursor:pointer;
    text-transform:uppercase;
    transition:transform .1s ease, background .1s ease;
  }
  .letter-key:hover{background:var(--blue);color:#fff;}
  .letter-key:active{transform:scale(.92);}
  .letter-key.wide{width:auto;padding:0 16px;background:var(--bg-soft-2);}

  /* results */
  #screen-results .card{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;}
  .results-stars{
    font-family:var(--font-display);
    font-weight:800;
    font-size:2.2rem;
    color:var(--yellow-deep);
    display:flex;
    align-items:center;
    gap:10px;
  }
  .results-stars .icon-star{width:34px;height:34px;}
  .results-msg{color:var(--ink-soft);font-weight:700;max-width:320px;}
  .results-best-badge{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:var(--yellow);
    color:#5A3E12;
    font-family:var(--font-display);
    font-weight:700;
    font-size:.85rem;
    padding:6px 14px;
    border-radius:var(--radius-pill);
  }
  .results-best-badge .icon{width:15px;height:15px;stroke:#5A3E12;}
  .results-best-badge[hidden]{display:none;}
  .results-best-line{color:var(--ink-soft);font-weight:600;font-size:.92rem;margin-top:-4px;}
  .results-actions{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    justify-content:center;
    margin-top:6px;
  }

  .confetti-layer{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:5;
    overflow:hidden;
  }
  .confetti-piece{
    position:absolute;
    top:-20px;
    width:9px;height:13px;
    border-radius:3px;
    animation:confettiFall 1.9s ease-in forwards;
  }

  /* ---------- motion ---------- */
  @keyframes floaty{0%,100%{transform:translateY(0);}50%{transform:translateY(-9px);}}
  @keyframes bouncePop{0%{transform:scale(1) rotate(0);}30%{transform:scale(1.28) rotate(-8deg);}55%{transform:scale(.94) rotate(6deg);}100%{transform:scale(1) rotate(0);}}
  @keyframes wobble{0%,100%{transform:translateX(0) rotate(0);}25%{transform:translateX(-6px) rotate(-4deg);}75%{transform:translateX(6px) rotate(4deg);}}
  @keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-6px);}40%{transform:translateX(6px);}60%{transform:translateX(-4px);}80%{transform:translateX(4px);}}
  @keyframes tilePop{0%{transform:scale(.5);opacity:0;}100%{transform:scale(1);opacity:1;}}
  @keyframes rise{0%{opacity:0;transform:translateY(10px);}100%{opacity:1;transform:translateY(0);}}
  @keyframes confettiFall{0%{transform:translateY(-10px) rotate(0);opacity:1;}100%{transform:translateY(70vh) rotate(360deg);opacity:0;}}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.01ms !important;animation-iteration-count:1 !important;}
  }

  @media (max-width:480px){
    .card{padding:24px 18px;border-radius:24px;}
    .mode-row{flex-direction:column;}
    .slot,.tile{width:38px;height:46px;font-size:1.15rem;}
    .letter-key{width:26px;height:42px;font-size:.9rem;}
    .letter-key.wide{padding:0 6px;}
    .kb-row{gap:4px;}
    .badge-grid{grid-template-columns:repeat(3,1fr);}
    .memory-input-row{gap:8px;}
    input#memory-input{flex:1 1 110px;max-width:150px;padding:12px 10px;font-size:1.05rem;}
    #btn-memory-check{padding:12px 16px;font-size:.9rem;}
  }
</style>

          <button type="button" class="theme-swatch" data-theme="playground">

            <span class="theme-swatch-info"><strong>Playground</strong><small>Bright and pastel</small></span>
            <svg class="icon theme-check" aria-hidden="true"><use href="#icon-check"></use></svg>
          </button>
          <button type="button" class="theme-swatch" data-theme="wild-woods">
            <span class="theme-swatch-preview theme-preview-wild-woods"></span>
            <span class="theme-swatch-info"><strong>Wild Woods</strong><small>Moonlit and foxy</small></span>
            <svg class="icon theme-check" aria-hidden="true"><use href="#icon-check"></use></svg>
          </button>
          <button type="button" class="theme-swatch" data-theme="crystal-shrine">
            <span class="theme-swatch-preview theme-preview-crystal-shrine"></span>
            <span class="theme-swatch-info"><strong>Crystal Shrine</strong><small>Glowing gemstones</small></span>
            <svg class="icon theme-check" aria-hidden="true"><use href="#icon-check"></use></svg>
          </button>

  <div id="confetti-layer" class="confetti-layer" aria-hidden="true"></div>
</div>

<script>
(function(){
  "use strict";

  var el = function(id){ return document.getElementById(id); };
  var screens = {
    home: el('screen-home'),
    scramble: el('screen-scramble'),
    memory: el('screen-memory'),
    results: el('screen-results'),
    badges: el('screen-badges'),
    themes: el('screen-themes')
  };
  var topbar = el('game-topbar');
  var confettiLayer = el('confetti-layer');

  var THEME_CONFETTI = {
    playground: ['#FF8FAE','#62C4F2','#6FE0B3','#FFC94D','#FF9A76'],
    'wild-woods': ['#C97B4A','#E8C165','#6FA98A','#9FD8B0','#D98B6D'],
    'crystal-shrine': ['#A97BE8','#5FC7C2','#E8C56B','#E28FAE','#8FE0C9']
  };

  var BADGE_POOLS = {
    alina: ['fox','wolf','owl','raven','deer','otter','hare','moth'],
    monty: ['amethyst','rose-quartz','citrine','clear-quartz','moonstone','obsidian','tigers-eye','labradorite']
  };
  var BADGE_META = {
    fox:{label:'Fox', symbol:'badge-fox'},
    wolf:{label:'Wolf', symbol:'badge-wolf'},
    owl:{label:'Owl', symbol:'badge-owl'},
    raven:{label:'Raven', symbol:'badge-raven'},
    deer:{label:'Deer', symbol:'badge-deer'},
    otter:{label:'Otter', symbol:'badge-otter'},
    hare:{label:'Hare', symbol:'badge-hare'},
    moth:{label:'Moth', symbol:'badge-moth'},
    amethyst:{label:'Amethyst', symbol:'badge-amethyst'},
    'rose-quartz':{label:'Rose Quartz', symbol:'badge-rose-quartz'},
    citrine:{label:'Citrine', symbol:'badge-citrine'},
    'clear-quartz':{label:'Clear Quartz', symbol:'badge-clear-quartz'},
    moonstone:{label:'Moonstone', symbol:'badge-moonstone'},
    obsidian:{label:'Obsidian', symbol:'badge-obsidian'},
    'tigers-eye':{label:'Tiger’s Eye', symbol:'badge-tigers-eye'},
    labradorite:{label:'Labradorite', symbol:'badge-labradorite'}
  };
  var POOL_TITLE = { alina: 'Alina’s Menagerie', monty: 'Monty’s Shrine' };
  var PLAYER_DEFAULT_THEME = { alina: 'wild-woods', monty: 'crystal-shrine' };
  var THEME_LABELS = { playground: 'Playground', 'wild-woods': 'Wild Woods', 'crystal-shrine': 'Crystal Shrine' };
  var WEEKLY_THRESHOLD = 15;
  var WEEKLY_MIN_DAYS = 3;

  var state = {
    words: [],
    mode: null,
    order: [],
    index: 0,
    stars: 0,
    maxStars: 0,
    player: null,
    playerName: ''
  };

  /* ---------------- theme engine ---------------- */

  var appRoot = document.querySelector('.app');
  var currentTheme = 'playground';

  function applyTheme(themeId, opts){
    opts = opts || {};
    currentTheme = themeId;
    appRoot.setAttribute('data-app-theme', themeId);
    document.querySelectorAll('.theme-swatch').forEach(function(btn){
      btn.classList.toggle('active', btn.getAttribute('data-theme') === themeId);
    });
    if(opts.persist && dbApi && state.player){
      dbPatch(state.player, { theme: themeId });
    }
  }

  document.querySelectorAll('.theme-swatch').forEach(function(btn){
    btn.addEventListener('click', function(){
      var themeId = btn.getAttribute('data-theme');
      applyTheme(themeId, { persist: true });
      el('themes-hint').textContent = state.player
        ? (THEME_LABELS[themeId] + ' saved for ' + state.playerName + '.')
        : (THEME_LABELS[themeId] + ' applied for this visit.');
    });
  });

  el('btn-open-themes').addEventListener('click', function(){ showScreen('themes'); });
  el('btn-themes-back').addEventListener('click', function(){ showScreen('home'); });
  el('btn-badges-back').addEventListener('click', function(){ showScreen('home'); });

  applyTheme('playground');

  /* ---------------- week / badge helpers ---------------- */

  function pad2(n){ return n < 10 ? '0' + n : '' + n; }

  function isoDateLocal(d){ return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }

  function mondayOf(d){
    var date = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    var day = date.getDay();
    var diff = (day === 0 ? -6 : 1 - day);
    date.setDate(date.getDate() + diff);
    return date;
  }

  function currentWeekStart(){ return isoDateLocal(mondayOf(new Date())); }

  /* ---------------- scoreboard (this browser's own storage) ----------------
     This is the standalone build: it has no Claude sign-in requirement, so
     it saves scores, badges and word lists to THIS browser's localStorage
     instead of Claude's shared database. That means it works for anyone,
     no account needed, but a given player's progress lives only on the
     device/browser they play on: it does not sync with any other copy of
     this game (including the Claude-hosted one). Same doc.get/set/update
     shape as the real db capability, so all the logic above and below
     (loadPlayerDoc, dbPatch, recordScore, etc.) works unmodified. */

  function localStorageAvailable(){
    try {
      var k = '__spellgame_test__' + Math.random();
      window.localStorage.setItem(k, '1');
      window.localStorage.removeItem(k);
      return true;
    } catch(e){ return false; }
  }

  function makeLocalStorageDb(){
    var PREFIX = 'spellgame:';
    function readDoc(path){
      try {
        var raw = window.localStorage.getItem(PREFIX + path);
        return raw ? JSON.parse(raw) : null;
      } catch(e){ return null; }
    }
    function writeDoc(path, data){
      try { window.localStorage.setItem(PREFIX + path, JSON.stringify(data)); }
      catch(e){ /* best-effort, e.g. storage full or blocked */ }
    }
    return {
      doc: function(path){
        return {
          get: function(){
            var data = readDoc(path);
            return Promise.resolve({
              exists: data !== null,
              data: function(){ return data; }
            });
          },
          set: function(data){
            writeDoc(path, data);
            return Promise.resolve();
          },
          update: function(patch){
            var cur = readDoc(path);
            if(cur === null){ return Promise.reject(new Error('invalid_argument: no such document')); }
            Object.keys(patch).forEach(function(k){ cur[k] = patch[k]; });
            writeDoc(path, cur);
            return Promise.resolve();
          }
        };
      }
    };
  }

  var dbApi = null;
  var pendingBadgeReveals = { alina: null, monty: null };
  var dbReadyPromise = Promise.resolve(localStorageAvailable() ? makeLocalStorageDb() : null);

  dbReadyPromise.then(function(db){
    dbApi = db;
    if(dbApi){ refreshScoreboard(); }
  }).catch(function(){ dbApi = null; });

  /** Merge-writes `patch` into a player's doc without ever sending a full
   * replacement built from a possibly-stale read — so a save in flight for
   * one field (say, words) can never be clobbered by a concurrent save to
   * a different field (say, theme or score). Falls back to create-with-
   * defaults only the first time a player's doc doesn't exist yet. */
  function dbPatch(key, patch){
    if(!dbApi || !key) return Promise.resolve();
    var ref = dbApi.doc('scores/' + key);
    return ref.update(patch).catch(function(){
      return ref.get().then(function(snap){
        var data = snap.exists ? snap.data() : { name: key === 'alina' ? 'Alina' : 'Monty' };
        Object.keys(patch).forEach(function(k){ data[k] = patch[k]; });
        return ref.set(data);
      });
    }).catch(function(){ /* best-effort */ });
  }

  /** Reads a player's doc, rolls their week over (awarding a badge if the
   * prior week hit the threshold) and persists that rollover as a patch of
   * only the fields that changed. Resolves {data, newBadge}. */
  function loadPlayerDoc(key){
    if(!dbApi){ return Promise.resolve(null); }
    var ref = dbApi.doc('scores/' + key);
    return ref.get().then(function(snap){
      var raw = snap.exists ? snap.data() : {};
      var data = {
        name: raw.name || (key === 'alina' ? 'Alina' : 'Monty'),
        totalRounds: raw.totalRounds || 0,
        totalStars: raw.totalStars || 0,
        lastPlayed: raw.lastPlayed || null,
        bestStars: raw.bestStars || 0,
        bestMax: raw.bestMax || 0,
        bestMode: raw.bestMode || null,
        bestDate: raw.bestDate || null,
        weekStart: raw.weekStart || currentWeekStart(),
        weekStars: raw.weekStars || 0,
        weekDays: raw.weekDays ? raw.weekDays.slice() : [],
        badges: raw.badges ? raw.badges.slice() : [],
        theme: raw.theme || null,
        words: raw.words || null
      };
      var nowWeek = currentWeekStart();
      var needsRollover = !!raw.weekStart && data.weekStart !== nowWeek;
      var needsCreate = !snap.exists;
      var newBadge = null;
      if(data.weekStart !== nowWeek){
        if(data.weekStars >= WEEKLY_THRESHOLD && data.weekDays.length >= WEEKLY_MIN_DAYS){
          var pool = BADGE_POOLS[key] || [];
          var unclaimed = pool.filter(function(id){ return data.badges.indexOf(id) === -1; });
          if(unclaimed.length){
            newBadge = unclaimed[Math.floor(Math.random() * unclaimed.length)];
            data.badges.push(newBadge);
          }
        }
        data.weekStart = nowWeek;
        data.weekStars = 0;
        data.weekDays = [];
      }
      if(needsCreate){
        return ref.set(data).then(function(){
          return { data: data, newBadge: newBadge };
        }).catch(function(){ return { data: data, newBadge: newBadge }; });
      }
      if(needsRollover){
        return dbPatch(key, { weekStart: data.weekStart, weekStars: data.weekStars, weekDays: data.weekDays, badges: data.badges }).then(function(){
          return { data: data, newBadge: newBadge };
        });
      }
      return { data: data, newBadge: null };
    });
  }

  function formatScoreLine(data){
    if(!data || !data.bestMax){ return 'No rounds yet'; }
    return data.bestStars + ' / ' + data.bestMax;
  }

  function weeklyProgress(data){
    var days = (data.weekDays || []).length;
    var starPct = Math.min(1, data.weekStars / WEEKLY_THRESHOLD);
    var dayPct = Math.min(1, days / WEEKLY_MIN_DAYS);
    return {
      days: days,
      pct: Math.round(Math.min(starPct, dayPct) * 100),
      label: data.weekStars + '/' + WEEKLY_THRESHOLD + ' stars · ' + days + '/' + WEEKLY_MIN_DAYS + ' days'
    };
  }

  function updateScoreboardItem(key, data){
    var scoreEl = el('sb-score-' + key);
    if(scoreEl){ scoreEl.textContent = formatScoreLine(data); }
    var fillEl = el('sb-week-fill-' + key);
    var labelEl = el('sb-week-label-' + key);
    if(fillEl && labelEl && data){
      var progress = weeklyProgress(data);
      fillEl.style.width = progress.pct + '%';
      labelEl.textContent = 'This week: ' + progress.label;
    }
  }

  function refreshScoreboard(){
    if(!dbApi){ return; }
    ['alina', 'monty'].forEach(function(key){
      loadPlayerDoc(key).then(function(result){
        if(!result){ return; }
        updateScoreboardItem(key, result.data);
        if(result.newBadge){ pendingBadgeReveals[key] = result.newBadge; }
      }).catch(function(){ /* scoreboard is a nice-to-have; ignore failures */ });
    });
  }

  function recordScore(){
    if(!dbApi || !state.player){ return; }
    var key = state.player;
    loadPlayerDoc(key).then(function(result){
      if(!result){ showBestResult(false, null); return; }
      var data = result.data;
      var prevPercent = data.bestMax ? data.bestStars / data.bestMax : -1;
      var thisPercent = state.maxStars ? state.stars / state.maxStars : 0;
      var isNewBest = thisPercent > prevPercent || (thisPercent === prevPercent && state.stars > data.bestStars);
      var nowIso = new Date().toISOString();
      data.name = state.playerName;
      data.totalRounds += 1;
      data.totalStars += state.stars;
      data.weekStars += state.stars;
      var todayLocal = isoDateLocal(new Date());
      if(data.weekDays.indexOf(todayLocal) === -1){ data.weekDays.push(todayLocal); }
      data.lastPlayed = nowIso;
      if(isNewBest){
        data.bestStars = state.stars;
        data.bestMax = state.maxStars;
        data.bestMode = state.mode;
        data.bestDate = nowIso;
      }
      var patch = {
        name: data.name,
        totalRounds: data.totalRounds,
        totalStars: data.totalStars,
        weekStars: data.weekStars,
        weekDays: data.weekDays,
        lastPlayed: data.lastPlayed
      };
      if(isNewBest){
        patch.bestStars = data.bestStars;
        patch.bestMax = data.bestMax;
        patch.bestMode = data.bestMode;
        patch.bestDate = data.bestDate;
      }
      return dbPatch(key, patch).then(function(){
        updateScoreboardItem(key, data);
        showBestResult(isNewBest, data);
      });
    }).catch(function(){ showBestResult(false, null); });
  }

  function showBestResult(isNewBest, best){
    var badge = el('results-best-badge');
    var line = el('results-best-line');
    badge.hidden = !isNewBest;
    if(best && best.bestMax){
      line.textContent = (isNewBest ? 'Personal best for ' : 'Best ever for ') + state.playerName + ': ' + best.bestStars + ' / ' + best.bestMax;
    } else {
      line.textContent = '';
    }
  }

  function showBadgeBanner(key, badgeId){
    var meta = BADGE_META[badgeId];
    if(!meta){ return; }
    el('badge-banner-title').textContent = 'New badge unlocked!';
    el('badge-banner-sub').textContent = meta.label + ' joined ' + (key === 'alina' ? 'Alina’s menagerie' : 'Monty’s shrine') + '.';
    el('badge-banner-use').setAttribute('href', '#' + meta.symbol);
    el('badge-banner').hidden = false;
  }

  el('badge-banner-dismiss').addEventListener('click', function(){ el('badge-banner').hidden = true; });

  function renderBadgesScreen(key, data){
    el('badges-title').textContent = POOL_TITLE[key] || 'Badges';
    var progress = weeklyProgress(data);
    el('badges-week-fill').style.width = progress.pct + '%';
    el('badges-week-label').textContent = 'This week: ' + progress.label + '. Keep going for a new badge!';
    var grid = el('badge-grid');
    grid.innerHTML = '';
    var pool = BADGE_POOLS[key] || [];
    var owned = data.badges || [];
    pool.forEach(function(id){
      var meta = BADGE_META[id];
      var unlocked = owned.indexOf(id) !== -1;
      var wrap = document.createElement('div');
      wrap.className = 'badge-slot' + (unlocked ? '' : ' locked');
      var medallion = document.createElement('div');
      medallion.className = 'badge-medallion';
      medallion.innerHTML = '<svg aria-hidden="true"><use href="#' + meta.symbol + '"></use></svg>';
      var label = document.createElement('span');
      label.className = 'badge-label';
      label.textContent = unlocked ? meta.label : '?';
      wrap.appendChild(medallion);
      wrap.appendChild(label);
      grid.appendChild(wrap);
    });
  }

  function openBadgesScreen(){
    if(!state.player){
      el('home-hint').textContent = 'Tap your name first to see your badges!';
      return;
    }
    if(!dbApi){
      el('home-hint').textContent = 'This browser can\u2019t save progress right now, so badges aren\u2019t available.';
      return;
    }
    loadPlayerDoc(state.player).then(function(result){
      if(!result){ return; }
      updateScoreboardItem(state.player, result.data);
      renderBadgesScreen(state.player, result.data);
      showScreen('badges');
    });
  }

  el('btn-open-badges').addEventListener('click', openBadgesScreen);
  el('btn-open-badges-top').addEventListener('click', openBadgesScreen);

  /* ---------------- word list (per player, saved to db) ---------------- */

  var wordSaveTimer = null;

  function saveWordsFor(key, text){
    dbPatch(key, { words: text });
  }

  function flushWordSave(){
    if(wordSaveTimer){
      clearTimeout(wordSaveTimer);
      wordSaveTimer = null;
      if(state.player){ saveWordsFor(state.player, el('word-input').value); }
    }
  }

  function updateWordListLabel(name, hasSaved){
    if(!name){
      el('word-list-heading').textContent = 'This week’s words';
      el('word-list-hint').textContent = '(one word per line or separated by commas)';
      return;
    }
    el('word-list-heading').textContent = name + '’s words this week';
    el('word-list-hint').textContent = hasSaved
      ? '(your saved list, edit any time: one word per line or separated by commas)'
      : '(add ' + name + '’s words for this week, one per line or separated by commas)';
  }

  el('word-input').addEventListener('input', function(){
    if(!state.player) return;
    clearTimeout(wordSaveTimer);
    var key = state.player;
    var text = el('word-input').value;
    updateWordListLabel(state.playerName, true);
    wordSaveTimer = setTimeout(function(){ saveWordsFor(key, text); }, 800);
  });

  /* ---------------- player picker ---------------- */

  ['alina', 'monty'].forEach(function(key){
    var btn = el('player-btn-' + key);
    btn.addEventListener('click', function(){
      flushWordSave();

      el('game-setup').hidden = false;
      state.player = key;
      state.playerName = btn.getAttribute('data-name');
      ['alina', 'monty'].forEach(function(k){
        el('player-btn-' + k).classList.toggle('selected', k === key);
      });
      el('home-hint').textContent = '';
      el('word-input').value = '';
      updateWordListLabel(state.playerName, false);

      if(dbApi){
        loadPlayerDoc(key).then(function(result){
          if(!result){ applyTheme(PLAYER_DEFAULT_THEME[key] || 'playground'); return; }
          updateScoreboardItem(key, result.data);
          if(result.data.words){
            el('word-input').value = result.data.words;
            updateWordListLabel(state.playerName, true);
          }
          var themeToApply = result.data.theme || PLAYER_DEFAULT_THEME[key] || 'playground';
          applyTheme(themeToApply);
          var reveal = result.newBadge || pendingBadgeReveals[key];
          pendingBadgeReveals[key] = null;
          if(reveal){ showBadgeBanner(key, reveal); }
        });
      } else {
        applyTheme(PLAYER_DEFAULT_THEME[key] || 'playground');
      }
    });
  });

  function showScreen(name){
    Object.keys(screens).forEach(function(k){ screens[k].classList.remove('active'); });
    screens[name].classList.add('active');
    topbar.hidden = !(name === 'scramble' || name === 'memory');
    if(name !== 'results'){ clearConfetti(); }
    if(name === 'home'){ refreshScoreboard(); }
  }

  function parseWords(text){
    return text.split(/[\n,]+/).map(function(w){ return w.trim(); }).filter(function(w){ return w.length > 0; });
  }

  function shuffleArray(arr){
    var a = arr.slice();
    for(var i = a.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function currentWord(){ return state.words[state.order[state.index]]; }

  function renderProgressDots(){
    var wrap = el('progress-dots');
    wrap.innerHTML = '';
    state.order.forEach(function(_, i){
      var d = document.createElement('span');
      d.className = 'dot' + (i < state.index ? ' done' : '') + (i === state.index ? ' current' : '');
      wrap.appendChild(d);
    });
  }

  function updateStarTally(){
    el('star-count').textContent = String(state.stars);
  }

  function addStars(n){
    if(n > 0){ state.stars += n; updateStarTally(); }
  }

  function setMascotFx(id, cls){
    var m = el(id);
    m.classList.remove('celebrate', 'oops');
    void m.offsetWidth;
    if(cls){ m.classList.add(cls); }
  }

  function spawnConfetti(){
    var palette = THEME_CONFETTI[currentTheme] || THEME_CONFETTI.playground;
    for(var i = 0; i < 26; i++){
      var piece = document.createElement('div');
      piece.className = 'confetti-piece';
      piece.style.left = (Math.random() * 100) + 'vw';
      piece.style.background = palette[i % palette.length];
      piece.style.animationDelay = (Math.random() * 0.5) + 's';
      piece.style.transform = 'rotate(' + Math.floor(Math.random() * 360) + 'deg)';
      confettiLayer.appendChild(piece);
    }
    setTimeout(clearConfetti, 2600);
  }

  function clearConfetti(){ confettiLayer.innerHTML = ''; }

  /* ---------------- home / start ---------------- */

  function startMode(mode){
    if(!state.player){
      el('home-hint').textContent = 'Tap your name first, then let’s play!';
      return;
    }
    flushWordSave();
    var words = parseWords(el('word-input').value);
    if(words.length === 0){
      el('home-hint').textContent = 'Add a few words first, then pick a game!';
      return;
    }
    el('home-hint').textContent = '';
    state.words = words;
    state.mode = mode;
    state.order = shuffleArray(words.map(function(_, i){ return i; }));
    state.index = 0;
    state.stars = 0;
    state.maxStars = words.length * 3;
    renderProgressDots();
    updateStarTally();
    if(mode === 'scramble'){
      showScreen('scramble');
      loadScrambleWord();
    } else {
      showScreen('memory');
      loadMemoryWord();
    }
  }

  el('btn-start-scramble').addEventListener('click', function(){ startMode('scramble'); });
  el('btn-start-memory').addEventListener('click', function(){ startMode('memory'); });
  el('btn-home').addEventListener('click', function(){ showScreen('home'); });

  /* ---------------- word scramble ---------------- */

  var scrambleAttempts = 0;
  var bankState = [];
  var slotState = [];
  var hintsOn = false;
  var hintTimer = null;
  var HINT_DURATION_MS = 4000;

  function showHintBriefly(){
    hintsOn = true;
    el('hint-button').classList.add('active');
    el('hint-button-label').textContent = 'Hint showing…';
    renderScramble();
    clearTimeout(hintTimer);
    hintTimer = setTimeout(function(){
      hintsOn = false;
      el('hint-button').classList.remove('active');
      el('hint-button-label').textContent = 'Show hint';
      renderScramble();
    }, HINT_DURATION_MS);
  }

  el('hint-button').addEventListener('click', showHintBriefly);

  function shuffleLetters(word){
    var letters = word.split('');
    if(letters.length < 2){ return letters; }
    var tries = 0, shuffled;
    do {
      shuffled = shuffleArray(letters);
      tries++;
    } while(shuffled.join('') === letters.join('') && tries < 12);
    return shuffled;
  }

  function loadScrambleWord(){
    scrambleAttempts = 0;
    var word = currentWord();
    var letters = shuffleLetters(word);
    bankState = letters.map(function(ch){ return { letter: ch, used: false }; });
    slotState = new Array(word.length).fill(null);
    el('scramble-message').className = 'game-message';
    el('scramble-message').textContent = 'Tap the letters in order!';
    setMascotFx('mascot-scramble', null);
    clearTimeout(hintTimer);
    hintsOn = false;
    el('hint-button').classList.remove('active');
    el('hint-button-label').textContent = 'Show hint';
    renderScramble();
  }

  function renderScramble(){
    var slotsWrap = el('scramble-slots');
    slotsWrap.innerHTML = '';
    var word = currentWord();
    slotState.forEach(function(bankIdx, i){
      var s = document.createElement('div');
      var filled = bankIdx !== null;
      var showHint = !filled && hintsOn;
      s.className = 'slot ' + (filled ? 'filled' : 'empty') + (showHint ? ' hinted' : '');
      s.textContent = filled ? bankState[bankIdx].letter : (showHint ? word[i] : '');
      if(filled){
        s.addEventListener('click', function(){ removeFromSlot(i); });
      }
      slotsWrap.appendChild(s);
    });

    var bankWrap = el('scramble-bank');
    bankWrap.innerHTML = '';
    bankState.forEach(function(entry, idx){
      var t = document.createElement('button');
      t.type = 'button';
      t.className = 'tile' + (entry.used ? ' used' : '');
      t.textContent = entry.letter;
      t.disabled = entry.used;
      t.addEventListener('click', function(){ placeLetter(idx); });
      bankWrap.appendChild(t);
    });
  }

  function placeLetter(bankIdx){
    if(bankState[bankIdx].used){ return; }
    var slotIdx = slotState.indexOf(null);
    if(slotIdx === -1){ return; }
    slotState[slotIdx] = bankIdx;
    bankState[bankIdx].used = true;
    renderScramble();
    if(slotState.indexOf(null) === -1){ checkScrambleAnswer(); }
  }

  function removeFromSlot(slotIdx){
    var bankIdx = slotState[slotIdx];
    if(bankIdx === null){ return; }
    bankState[bankIdx].used = false;
    slotState[slotIdx] = null;
    renderScramble();
  }

  function checkScrambleAnswer(){
    var built = slotState.map(function(bankIdx){ return bankState[bankIdx].letter; }).join('');
    var correct = built.toLowerCase() === currentWord().toLowerCase();
    if(correct){
      var stars = scrambleAttempts === 0 ? 3 : (scrambleAttempts === 1 ? 2 : 1);
      addStars(stars);
      el('scramble-message').className = 'game-message warm';
      el('scramble-message').textContent = 'Yes! That’s it!';
      setMascotFx('mascot-scramble', 'celebrate');
      setTimeout(advanceRound, 1300);
    } else {
      scrambleAttempts++;
      el('scramble-message').className = 'game-message nudge';
      el('scramble-message').textContent = 'So close! Give it another go!';
      setMascotFx('mascot-scramble', 'oops');
      el('scramble-slots').classList.add('shake');
      setTimeout(function(){
        el('scramble-slots').classList.remove('shake');
        bankState.forEach(function(entry){ entry.used = false; });
        slotState = new Array(currentWord().length).fill(null);
        renderScramble();
      }, 700);
    }
  }

  /* ---------------- memory flash ---------------- */

  var memoryAttempts = 0;
  var memoryTimer = null;

  function loadMemoryWord(){
    memoryAttempts = 0;
    var word = currentWord();
    el('memory-message').className = 'game-message';
    el('memory-message').textContent = 'Watch closely…';
    var wordEl = el('memory-word');
    wordEl.textContent = word;
    wordEl.classList.remove('hidden-word');
    el('memory-input-row').style.display = 'none';
    el('letter-grid').style.display = 'none';
    el('memory-input').value = '';
    setMascotFx('mascot-memory', null);

    var showMs = Math.min(4000, Math.max(1500, 900 + word.length * 350));
    clearTimeout(memoryTimer);
    memoryTimer = setTimeout(function(){
      wordEl.classList.add('hidden-word');
      el('memory-message').textContent = 'Now spell it from memory!';
      el('memory-input-row').style.display = 'flex';
      buildLetterGrid();
      el('letter-grid').style.display = 'grid';
      el('memory-input').focus();
    }, showMs);
  }

  function buildLetterGrid(){
    var grid = el('letter-grid');
    grid.innerHTML = '';
    var rows = ['qwertyuiop', 'asdfghjkl', 'zxcvbnm'];
    rows.forEach(function(rowLetters, rowIdx){
      var rowEl = document.createElement('div');
      rowEl.className = 'kb-row';
      rowLetters.split('').forEach(function(ch){
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'letter-key';
        b.textContent = ch;
        b.addEventListener('click', function(){
          el('memory-input').value += ch;
          el('memory-input').focus();
        });
        rowEl.appendChild(b);
      });
      if(rowIdx === 2){
        var back = document.createElement('button');
        back.type = 'button';
        back.className = 'letter-key wide';
        back.textContent = '←';
        back.setAttribute('aria-label', 'Backspace');
        back.addEventListener('click', function(){
          var input = el('memory-input');
          input.value = input.value.slice(0, -1);
          input.focus();
        });
        rowEl.appendChild(back);
      }
      grid.appendChild(rowEl);
    });
  }

  function submitMemory(){
    var input = el('memory-input');
    var value = input.value.trim();
    if(!value){ return; }
    var correct = value.toLowerCase() === currentWord().toLowerCase();
    if(correct){
      var stars = memoryAttempts === 0 ? 3 : 1;
      addStars(stars);
      el('memory-message').className = 'game-message warm';
      el('memory-message').textContent = 'Spot on!';
      setMascotFx('mascot-memory', 'celebrate');
      setTimeout(advanceRound, 1300);
    } else {
      memoryAttempts++;
      setMascotFx('mascot-memory', 'oops');
      if(memoryAttempts >= 2){
        el('memory-message').className = 'game-message nudge';
        el('memory-message').textContent = 'It’s spelled ' + currentWord() + '. Nice try, on we go!';
        setTimeout(advanceRound, 2000);
      } else {
        el('memory-message').className = 'game-message nudge';
        el('memory-message').textContent = 'So close! Have another try.';
        input.value = '';
        input.focus();
      }
    }
  }

  el('btn-memory-check').addEventListener('click', submitMemory);
  el('memory-input').addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ submitMemory(); }
  });

  /* ---------------- shared progression ---------------- */

  function advanceRound(){
    state.index++;
    if(state.index >= state.order.length){
      showResults();
      return;
    }
    renderProgressDots();
    if(state.mode === 'scramble'){ loadScrambleWord(); }
    else { loadMemoryWord(); }
  }

  function showResults(){
    clearTimeout(memoryTimer);
    renderProgressDots();
    el('results-stars-count').textContent = String(state.stars);
    el('results-stars-max').textContent = String(state.maxStars);
    var pct = state.maxStars > 0 ? state.stars / state.maxStars : 0;
    var title, msg;
    if(pct >= 0.9){ title = 'superstar speller!'; msg = 'Every word nailed. Amazing work.'; }
    else if(pct >= 0.6){ title = 'brilliant round!'; msg = 'Loads of great spelling in there.'; }
    else { title = 'nice one!'; msg = 'Good practice! Those words are getting easier already.'; }
    el('results-title').textContent = (state.playerName || 'Hey') + ', ' + title;
    el('results-msg').textContent = msg;
    el('results-best-badge').hidden = true;
    el('results-best-line').textContent = '';
    showScreen('results');
    setMascotFx('mascot-results', 'celebrate');
    spawnConfetti();
    recordScore();
  }

  el('btn-play-again').addEventListener('click', function(){ startMode(state.mode); });
  el('btn-switch-mode').addEventListener('click', function(){ startMode(state.mode === 'scramble' ? 'memory' : 'scramble'); });
  el('btn-new-list').addEventListener('click', function(){ showScreen('home'); });

})();
</script>
